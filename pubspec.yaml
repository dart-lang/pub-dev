name: workspace
environment:
  sdk: ^3.6.0

workspace:
  - app/
  - pkg/pub_integration
  - pkg/_pub_shared
  - pkg/api_builder
  - pkg/web_css
  - pkg/code_coverage
  - pkg/pub_worker
  - pkg/web_app
  - pkg/fake_gcloud
  - pkg/indexed_blob
  - pkg/pub_package_reader
  - pkg/puppeteer_screenshots
  - pkg/sanitize_html
  - pkg/image_proxy
  - pkg/runsc
  - pkg/unzip

dev_dependencies:
  lints: ^6.0.0

# `circuit_breaker` and `circuit_breaker_http` are not published on pub.dev yet,
# so the workspace pins them to a git commit.
# TODO: drop this block once both packages are published.
dependency_overrides:
  circuit_breaker:
    git:
      url: https://github.com/sigurdm/circuit_breaker.git
      path: pkgs/circuit_breaker
      ref: a052dda6be20993a0c94f464ba7866f67084c730
  circuit_breaker_http:
    git:
      url: https://github.com/sigurdm/circuit_breaker.git
      path: pkgs/circuit_breaker_http
      ref: a052dda6be20993a0c94f464ba7866f67084c730

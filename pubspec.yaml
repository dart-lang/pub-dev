name: workspace
environment:
  sdk: ^3.6.0

workspace:
  - app/
  - pkg/pub_integration
  - pkg/_pub_shared
  - pkg/api_builder
  - pkg/web_css
  - pkg/code_coverage
  - pkg/pub_worker
  - pkg/web_app
  - pkg/fake_gcloud
  - pkg/indexed_blob
  - pkg/pub_package_reader
  - pkg/puppeteer_screenshots
  - pkg/sanitize_html
  - pkg/image_proxy
  - pkg/runsc
  - pkg/unzip

dev_dependencies:
  lints: ^6.0.0

dependency_overrides:
  pana:
    git:
      url: https://github.com/sigurdm/pana.git
      ref: api-diff
  api_summary:
    git:
      url: https://github.com/sigurdm/tools.git
      path: pkgs/api_summary
      ref: api-summary-diff
